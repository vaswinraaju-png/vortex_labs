<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  (function (w, d, s, u) {
    if (w.oaiq) return;
    var q = function () { q.q.push(arguments); };
    q.q = [];
    w.oaiq = q;
    var js = d.createElement(s);
    js.async = true;
    js.src = u;
    var f = d.getElementsByTagName(s)[0];
    f.parentNode.insertBefore(js, f);
  })(window, document, "script", "https://bzrcdn.openai.com/sdk/oaiq.min.js");
  oaiq("init", { pixelId: "4dJ5M9GtMmeF5kE4wxxd7w" });
  oaiq("measure", "page_viewed", {
    type: "contents",
    contents: [{ id: "payment", name: "Payment", content_type: "page" }]
  });
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment, Ads Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>
<body>

<div class="flow-wrap">
  <div class="flow-card">
    <div class="flow-steps">
      <div class="flow-step active"></div>
      <div class="flow-step active"></div>
      <div class="flow-step"></div>
    </div>
    <h2>Payment</h2>
    <p class="sub">Step 2 of 3, secured by Cashfree</p>

    <div id="payment-error" class="flow-error"></div>

    <div class="flow-summary">
      <div class="flow-summary-row"><span>Name</span><span id="pay-name">—</span></div>
      <div class="flow-summary-row"><span>Email</span><span id="pay-email">—</span></div>
      <div class="flow-summary-row total"><span>Amount due</span><span id="pay-amount">—</span></div>
    </div>

    <form onsubmit="submitPayment(event)">
      <button type="submit" class="btn-primary" id="pay-btn" style="width:100%;">Pay ₹499</button>
      <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:14px;">
        You'll be redirected to Cashfree's secure checkout.
      </p>
    </form>
  </div>
</div>

<script src="js/checkout.js"></script>
<script>initPaymentPage();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment, Ads Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="flow-wrap">
  <div class="flow-card">
    <div class="flow-steps">
      <div class="flow-step active"></div>
      <div class="flow-step active"></div>
      <div class="flow-step"></div>
    </div>
    <h2>Payment</h2>
    <p class="sub">Step 2 of 3</p>

    <div class="flow-summary">
      <div class="flow-summary-row"><span>Name</span><span id="pay-name">—</span></div>
      <div class="flow-summary-row"><span>Email</span><span id="pay-email">—</span></div>
      <div class="flow-summary-row total"><span>Amount due</span><span id="pay-amount">—</span></div>
    </div>

    <!--
      TODO: this is a placeholder payment step.
      Replace the button below with your real payment gateway's
      checkout button/widget (Razorpay, Stripe, PayPal, etc).
      See js/checkout.js for integration notes and examples.
    -->
    <form onsubmit="submitPaymentStub(event)">
      <button type="submit" class="btn-primary" id="pay-btn" style="width:100%;">Pay $19</button>
      <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:14px;">
        Payment gateway not yet connected. This is a placeholder step.
      </p>
    </form>
  </div>
</div>

<script src="js/checkout.js"></script>
<script>initPaymentPage();</script>
</body>
</html>

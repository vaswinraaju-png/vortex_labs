<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<script>
(async function(){
  const data = JSON.parse(sessionStorage.getItem('checkoutData') || '{}');
  if (!data.name) { location.href = '/checkout.html'; return; }

  const res = await fetch('/api/create-order', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  const order = await res.json();
  if (order.error) { alert(order.error); location.href = '/checkout.html'; return; }

  const rzp = new Razorpay({
    key: order.keyId,
    amount: order.amount * 100,
    currency: 'INR',
    name: 'Ads Dashboard',
    description: 'Ads Dashboard - One-time purchase',
    order_id: order.orderId,
    prefill: { name: data.name, email: data.email, contact: data.phone },
    handler: async function(response){
      const verify = await fetch('/api/order-status', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          ...response, name: data.name, email: data.email, phone: data.phone, amount: order.amount
        })
      });
      const result = await verify.json();
      if (result.verified) {
        sessionStorage.setItem('orderComplete', '1');
        location.href = '/success.html';
      } else {
        alert('Payment verification failed. Contact support.');
      }
    },
    modal: { ondismiss: function(){ location.href = '/checkout.html'; } }
  });
  rzp.open();
})();
</script>
</body>
</html>

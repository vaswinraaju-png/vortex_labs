<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  (function (w, d, s, u) {
    if (w.oaiq) return;
    var q = function () { q.q.push(arguments); };
    q.q = [];
    w.oaiq = q;
    var js = d.createElement(s);
    js.async = true;
    js.src = u;
    var f = d.getElementsByTagName(s)[0];
    f.parentNode.insertBefore(js, f);
  })(window, document, "script", "https://bzrcdn.openai.com/sdk/oaiq.min.js");
  oaiq("init", { pixelId: "4dJ5M9GtMmeF5kE4wxxd7w" });
  oaiq("measure", "page_viewed", {
    type: "contents",
    contents: [{ id: "checkout", name: "Checkout", content_type: "page" }]
  });
  oaiq("measure", "items_added", {
    type: "contents",
    amount: 499,
    currency: "INR",
    contents: [{ id: "ads-dashboard", name: "Ads Dashboard", content_type: "product", quantity: 1, amount: 499, currency: "INR" }]
  });
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout, Ads Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="flow-wrap">
  <div class="flow-card">
    <div class="flow-steps">
      <div class="flow-step active"></div>
      <div class="flow-step"></div>
      <div class="flow-step"></div>
    </div>
    <h2>Your details</h2>
    <p class="sub">Step 1 of 3. We'll use this to send your download link</p>

    <div id="checkout-error" class="flow-error"></div>

    <form onsubmit="submitCheckout(event)">
      <div class="field">
        <label for="buyer-name">Full Name</label>
        <input type="text" id="buyer-name" placeholder="Jane Doe" required>
      </div>
      <div class="field">
        <label for="buyer-email">Email</label>
        <input type="email" id="buyer-email" placeholder="jane@company.com" required>
      </div>
      <div class="field">
        <label for="buyer-phone">Phone</label>
        <input type="tel" id="buyer-phone" placeholder="+91 98765 43210" required>
      </div>

      <div class="flow-summary">
        <div class="flow-summary-row"><span>Ads Dashboard, Full License</span><span>₹499</span></div>
        <div class="flow-summary-row total"><span>Total</span><span>₹499</span></div>
      </div>

      <button type="submit" class="btn-primary" style="width:100%;">Continue to Payment</button>
    </form>
  </div>
</div>

<script src="js/checkout.js"></script>
</body>
</html>

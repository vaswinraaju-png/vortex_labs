<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're all set, Ads Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="flow-wrap">
  <div class="flow-card">
    <div class="flow-steps">
      <div class="flow-step active"></div>
      <div class="flow-step active"></div>
      <div class="flow-step active"></div>
    </div>
    <div class="success-icon">✓</div>
    <h2>Payment successful</h2>
    <p class="sub">Thanks, <span id="success-name">—</span>. Your dashboard is ready.</p>

    <div class="flow-summary">
      <div class="flow-summary-row"><span>Email</span><span id="success-email">—</span></div>
      <div class="flow-summary-row"><span>Order ID</span><span id="success-order-id">—</span></div>
    </div>

    <div class="download-box">
      <div style="font-weight:700;font-size:15px;">Your download is ready</div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px;">A copy has also been sent to your email.</div>
      <!-- TODO: point this at the real delivery URL (signed download link, repo invite, etc.) -->
      <a href="#" id="download-link">Download Ads Dashboard</a>
    </div>

    <p style="text-align:center;font-size:12px;color:var(--muted);">
      Need help? Reach out and we'll get you set up.
    </p>
  </div>
</div>

<script src="js/checkout.js"></script>
<script>initSuccessPage();</script>
</body>
</html>
